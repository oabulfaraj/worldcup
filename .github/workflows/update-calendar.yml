name: تحديث تقويم كأس العالم / Update World Cup Calendar

on:
  schedule:
    # يشتغل كل ساعة تلقائياً (بتوقيت UTC)
    - cron: "0 * * * *"
  workflow_dispatch:   # يسمح بالتشغيل اليدوي من زر في GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ICS from live source
        run: python build_ics.py

      - name: Commit & push if changed
        run: |
          git config user.name  "worldcup-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain worldcup2026.ics)" ]; then
            git add worldcup2026.ics
            git commit -m "Auto-update calendar $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Calendar updated and pushed."
          else
            echo "ℹ️ No changes — calendar already up to date."
          fi
